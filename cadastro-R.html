<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZapFood - Cadastro</title>
    <link rel="stylesheet" href="./assets/css/index.css" />
</head>
<body class="body-CDrestaurante">

    <!-- Conteúdo principal do site -->
    <main class="main-CDrestaurante">
        <section class="sessao-CDrestaurante">
            <form class="form-CDrestaurante" id="form-restaurante">
                <h1>Cadastre-se</h1>

                <input type="text" id="nome" placeholder="Nome do Restaurante:" />
                <input type="email" id="email" placeholder="Email:" />
                <input type="password" id="senha" placeholder="Senha" />
                <input type="tel" id="telefone" placeholder="Telefone:" />
                <input type="text" id="estado" placeholder="Endereço:" />
                <input type="text" id="cnpj" placeholder="CNPJ:" />

                <button class="enviar" type="submit">Enviar</button>
                <div id="mensagem" class="mensagem-oculta"></div>
            </form>
        </section>
        <!-- Seção de boas-vindas -->
        <section class="sessao-BVrestaurante">
            <h1>Bem Vindo</h1>
            <p>Envie suas informações para fazer<br> o cadastro do nosso site. Caso ja tenha uma conta,<br> clique abaixo:</p>
            <button class="ghost" id="signIn"><a href="./login.html">Entrar</a></button>
        </section>
    </main>
    <script src="./assets/js/index.js"></script>
</body>
</html>
