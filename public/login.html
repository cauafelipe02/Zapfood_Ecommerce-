<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>ZapFood - Login</title>
</head>
<body class="body-login">

    <!-- Conteúdo principal do site -->
    <main class="main-login">
        <!-- Formulário de login -->
        <form class="form-login">
            <h1>Login</h1>

            <label for="email">Digite seu e-mail:</label>
            <input type="email" id="email-login">

            <label for="senha">Digite sua senha:</label>
            <input type="password" id="senha-login">

            <div class="container-label">
                <label for="entrar">Entrar como:</label>
                <input name="tipoUsuario" type="radio" class="cliente" id="entrar-cliente">
                <label for="cliente">Cliente</label>
                <input name="tipoUsuario" type="radio" class="restaurante" id="entrar-restaurante">
                <label for="restaurante">Restaurante</label>
            </div>

            <p class="esqueceu-senha">Esqueceu sua senha? <a href="#">Clique aqui!</a></p>

            <a href="./cadastro-C.html" class="create-account">Criar conta</a>
            <button class="entrar" type="button" id="btn-entrar">Entrar</button>
        </form>
    </main>
    <script src="./assets/js/integration/integration.js"></script>
</body>
</html>
