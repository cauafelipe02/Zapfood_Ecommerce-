<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>ZapFood - Login</title>
</head>
<body class="body-login">

    <!-- Conteúdo principal do site -->
    <main class="main-login">
        <!-- Formulário de login -->
        <form class="form-login" action="">
            <div class="titulo">
                <h1>Login</h1>
            </div>

            <div class="container-label">
                <label for="email">Digite seu e-mail:</label>
                <input type="email" id="email">
            </div>

            <div class="container-label-2">
                <label for="senha">Digite sua senha:</label>
                <input type="password" id="senha">
            </div>

            <div class="container-label-3">
                <label for="entrar">Entrar como:</label>
                <input name="tipoUsuario" type="radio" class="cliente" id="cliente">
                <label for="cliente">Cliente</label>
                <input name="tipoUsuario" type="radio" class="restaurante" id="restaurante">
                <label for="restaurante">Restaurante</label>
            </div>

            <p class="esqueceu-senha">Esqueceu sua senha? 
                <a href="#">Clique aqui!</a>
            </p>

            <button class="entrar" type="submit">Entrar</button>

            <a href="./cadastro-C.html" class="create-account">Criar conta</a>
        </form>
    </main>
    <script type="module" src="./assets/js/index.js"></script>
</body>
</html>
