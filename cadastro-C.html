
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/index.css">
    <title>ZapFood - Cadastro</title>
</head>
<body class="body-CDcliente">

    <!-- Conteúdo principal do site -->
    <main class="main-CDcliente">

        <!-- Sessão com Formulário de cadastro -->
        <section class="sessao-CDcliente">
            <form class="form-CDcliente" action="">
                <h1>Cadastre-se</h1>

                <input type="text" id="nome-cliente" placeholder="Nome Completo:">
                <input type="email" id="email-cliente" placeholder="Email:">
                <input type="password" id="senha-cliente" placeholder="Senha">
                <input type="tel" id="telefone-cliente" placeholder="Telefone:">

                <div class="checkbox-group">
                    <p>Sexo:</p><br>
                    <label for="masculino">Masculino</label>
                    <input type="radio" id="masculino-cliente" name="sexo" value="masculino">
                    <label for="feminino">Feminino</label>
                    <input type="radio" id="feminino-cliente" name="sexo" value="feminino">
                    <label for="outro">Outro</label>
                    <input type="radio" id="outro-cliente" name="sexo" value="outro">
                </div>
                <div class="date-group">
                    <label for="data-nascimento">Data de Nascimento:</label>
                    <input type="date" class="data-nascimento" id="dataN-cliente" name="data-nascimento">
                </div>

                <input type="text" id="estado-cliente" placeholder="Estado:">
                <input type="text" id="endereco-cliente" placeholder="Endereço:">

                <button class="enviar" type="submit" id="btn-enviar-cliente">Enviar</button>
            </form>
        </section>

        <!-- Seção de boas-vindas -->
        <section class="sessao-BVcliente">
            <h1>Bem Vindo</h1>
            <p>Envie suas informações para fazer<br> o cadastro do nosso site. Caso ja tenha uma conta,<br> clique abaixo:</p>
            <button class="ghost" id="signIn"><a href="./login.html">Entrar</a></button>
        </section>
    </main>
    <script src="./assets/js/index.js"></script>
</body>
</html>
